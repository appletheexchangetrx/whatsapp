<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#075E54">
  <title>WhatsApp</title>
  <style>
    :root {
      color-scheme: light;
      --green: #075E54;
      --green-light: #128C7E;
      --accent: #25D366;
      --page: #f0f2f5;
      --chat-bg: #efeae2;
      --white: #fff;
      --text: #111b21;
      --muted: #667781;
      --border: #e9edef;
      --received: #fff;
      --sent: #d9fdd3;
      --header-height: 60px;
      --sidebar-width: 360px;
      --radius: 12px;
      font-family: Arial, Helvetica, sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; color: var(--text); background: var(--page); }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .app {
      display: flex;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: var(--white);
    }

    .chats-page {
      display: flex;
      flex: 0 0 var(--sidebar-width);
      min-width: 0;
      flex-direction: column;
      background: var(--white);
      border-right: 1px solid var(--border);
    }

    .messages-page {
      display: flex;
      flex: 1;
      min-width: 0;
      min-height: 0;
      flex-direction: column;
      background: var(--chat-bg);
    }

    .app-header {
      display: flex;
      flex: 0 0 var(--header-height);
      height: var(--header-height);
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      color: var(--white);
      background: var(--green);
    }

    .app-title {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
      font-weight: 600;
    }

    .chat-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      background: var(--white);
    }

    .chat-item {
      display: flex;
      width: 100%;
      min-height: 72px;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border: 0;
      border-bottom: 1px solid var(--border);
      text-align: left;
      color: inherit;
      background: var(--white);
      cursor: pointer;
    }

    .chat-item:hover, .chat-item[aria-current="true"] { background: #f5f6f6; }
    .avatar {
      display: grid;
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      place-items: center;
      border-radius: 50%;
      color: var(--green);
      background: #dde8e5;
      font-size: 16px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .chat-info {
      display: flex;
      flex: 1;
      min-width: 0;
      flex-direction: column;
      gap: 4px;
    }

    .contact-name {
      overflow: hidden;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .last-message {
      overflow: hidden;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-time {
      align-self: flex-start;
      padding-top: 2px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .messages-header { gap: 12px; }
    .back-button {
      display: none;
      width: 32px;
      height: 40px;
      flex: 0 0 32px;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 0;
      color: var(--white);
      background: transparent;
      cursor: pointer;
    }

    .back-button svg { width: 22px; height: 22px; }
    .messages-contact {
      display: flex;
      min-width: 0;
      flex: 1;
      align-items: center;
      gap: 12px;
    }

    .messages-contact .avatar { width: 40px; height: 40px; flex-basis: 40px; }
    .messages-contact .contact-name { color: var(--white); }

    .message-list {
      display: flex;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      padding: 20px 16px;
      overscroll-behavior: contain;
      background-color: var(--chat-bg);
      background-image: radial-gradient(rgba(17, 27, 33, .035) .7px, transparent .7px);
      background-size: 18px 18px;
    }

    .message-row { display: flex; width: 100%; }
    .message-row.received { justify-content: flex-start; }
    .message-row.sent { justify-content: flex-end; }

    .message-bubble {
      max-width: min(80%, 560px);
      padding: 8px 12px 6px;
      border-radius: 8px;
      box-shadow: 0 1px 1px rgba(11, 20, 26, .08);
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.45;
    }

    .received .message-bubble { background: var(--received); }
    .sent .message-bubble { background: var(--sent); }
    .message-time {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.2;
      text-align: right;
    }

    .message-composer {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      background: #f0f2f5;
    }

    .message-input {
      display: block;
      width: 100%;
      height: 44px;
      min-width: 0;
      flex: 1;
      padding: 0 16px;
      border: 0;
      border-radius: 999px;
      outline: none;
      color: var(--text);
      background: var(--white);
      font-size: 16px;
    }

    .message-input:focus { box-shadow: 0 0 0 2px rgba(7, 94, 84, .18); }
    .message-input::placeholder { color: var(--muted); opacity: 1; }

    .send-button {
      display: grid;
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: var(--white);
      background: var(--green);
      cursor: pointer;
    }

    .send-button:disabled { opacity: .55; cursor: default; }
    .send-button svg { width: 20px; height: 20px; }

    @media (max-width: 767px) {
      .app { position: relative; }
      .chats-page, .messages-page {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        flex: none;
        border-right: 0;
      }
      .messages-page { display: none; }
      .app.show-messages .chats-page { display: none; }
      .app.show-messages .messages-page { display: flex; }
      .back-button { display: flex; }
      .chat-item[aria-current="true"] { background: var(--white); }
      .message-list { padding: 16px 12px; }
    }

    @media (min-width: 768px) {
      .chats-page { display: flex; }
      .messages-page { display: flex; }
      .back-button { display: none; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .chat-item, .send-button { transition: background-color .15s ease, opacity .15s ease; }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <section class="chats-page" aria-label="Chats">
      <header class="app-header">
        <h1 class="app-title">WhatsApp</h1>
      </header>
      <div class="chat-list" id="chatList" role="list"></div>
    </section>

    <section class="messages-page" id="messagesPage" aria-label="Messages">
      <header class="app-header messages-header">
        <button class="back-button" id="backButton" type="button" aria-label="Back to chats">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m15 18-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="messages-contact">
          <div class="avatar" id="headerAvatar" aria-hidden="true">A</div>
          <div class="contact-name" id="headerName">Alex</div>
        </div>
      </header>

      <div class="message-list" id="messageList" aria-live="polite" aria-label="Conversation messages"></div>

      <form class="message-composer" id="messageForm">
        <input
          class="message-input"
          id="messageInput"
          type="text"
          placeholder="Message"
          aria-label="Message"
          autocomplete="off"
          maxlength="4000"
        >
        <button class="send-button" id="sendButton" type="submit" aria-label="Send message" disabled>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M21 3 10.8 13.2M21 3l-6.5 18-3.7-7.8L3 9.5 21 3Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>
    </section>
  </main>

  <script>
    const conversations = [
      {
        id: "alex",
        name: "Alex",
        messages: [
          { from: "received", text: "Hello!", time: "10:40" },
          { from: "sent", text: "Hi, how are you?", time: "10:42" }
        ]
      },
      {
        id: "sarah",
        name: "Sarah",
        messages: [
          { from: "received", text: "How are you?", time: "09:28" },
          { from: "sent", text: "I'm doing well, thank you.", time: "09:30" }
        ]
      },
      {
        id: "michael",
        name: "Michael",
        messages: [
          { from: "received", text: "See you soon", time: "Yesterday" }
        ]
      }
    ];

    const app = document.getElementById("app");
    const chatList = document.getElementById("chatList");
    const messageList = document.getElementById("messageList");
    const headerAvatar = document.getElementById("headerAvatar");
    const headerName = document.getElementById("headerName");
    const messageForm = document.getElementById("messageForm");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const backButton = document.getElementById("backButton");

    let activeConversationId = conversations[0].id;

    function initials(name) {
      return name.trim().split(/\s+/).slice(0, 2).map(part => part[0]).join("").toUpperCase();
    }

    function currentTime() {
      return new Intl.DateTimeFormat(undefined, {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).format(new Date());
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[character]);
    }

    function getConversation(id) {
      return conversations.find(conversation => conversation.id === id);
    }

    function latestMessage(conversation) {
      return conversation.messages[conversation.messages.length - 1];
    }

    function renderChats() {
      chatList.innerHTML = conversations.map(conversation => {
        const latest = latestMessage(conversation);
        const preview = latest ? latest.text : "";
        const time = latest ? latest.time : "";
        const selected = conversation.id === activeConversationId;
        return `
          <button class="chat-item" type="button" role="listitem"
            data-conversation-id="${escapeHTML(conversation.id)}"
            aria-current="${selected ? "true" : "false"}">
            <span class="avatar" aria-hidden="true">${escapeHTML(initials(conversation.name))}</span>
            <span class="chat-info">
              <span class="contact-name">${escapeHTML(conversation.name)}</span>
              <span class="last-message">${escapeHTML(preview)}</span>
            </span>
            <span class="chat-time">${escapeHTML(time)}</span>
          </button>
        `;
      }).join("");
    }

    function renderMessages() {
      const conversation = getConversation(activeConversationId);
      if (!conversation) return;

      headerAvatar.textContent = initials(conversation.name);
      headerName.textContent = conversation.name;

      messageList.innerHTML = conversation.messages.map(message => `
        <div class="message-row ${message.from === "sent" ? "sent" : "received"}">
          <div class="message-bubble">
            ${escapeHTML(message.text)}
            <span class="message-time">${escapeHTML(message.time)}</span>
          </div>
        </div>
      `).join("");

      messageList.scrollTop = messageList.scrollHeight;
    }

    function openConversation(id) {
      if (!getConversation(id)) return;
      activeConversationId = id;
      renderChats();
      renderMessages();
      app.classList.add("show-messages");
      messageInput.value = "";
      updateSendButton();
    }

    function updateSendButton() {
      sendButton.disabled = messageInput.value.trim().length === 0;
    }

    chatList.addEventListener("click", event => {
      const item = event.target.closest("[data-conversation-id]");
      if (item) openConversation(item.dataset.conversationId);
    });

    backButton.addEventListener("click", () => {
      app.classList.remove("show-messages");
    });

    messageInput.addEventListener("input", updateSendButton);

    messageForm.addEventListener("submit", event => {
      event.preventDefault();
      const text = messageInput.value.trim();
      const conversation = getConversation(activeConversationId);
      if (!text || !conversation) return;

      conversation.messages.push({
        from: "sent",
        text,
        time: currentTime()
      });

      messageInput.value = "";
      updateSendButton();
      renderMessages();
      renderChats();
      messageInput.focus();
    });

    renderChats();
    renderMessages();
  </script>
</body>
</html>
